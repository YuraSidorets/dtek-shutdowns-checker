<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07835f">
  <title>Find out.</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2307835f' d='M14 1 3 14h8l-1 9L22 9h-9z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=20261029-houses">
  <script type="module" src="./app.mjs?v=20261029-houses"></script>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="./" aria-label="Find out home"><svg viewBox="0 0 24 28" aria-hidden="true"><path d="M14 0 1 16h9L8 28 24 11H13z"/></svg>Find out.</a><span>Kyiv <span aria-hidden="true">·</span> Europe/Kyiv</span></div></header>
  <main>
    <section class="intro"><h1>Find out.</h1></section>
    <form id="address-form" class="panel address-panel">
      <div class="friends" id="friends"></div>
      <div class="form-bottom"><p id="storage-note">Saved in this browser.<br><button type="button" class="text-button subtle" id="forget">Forget addresses</button></p><div class="actions"><button class="primary" type="submit" id="check">Find shared time <span aria-hidden="true">↗</span></button><button type="button" class="text-button" id="samples">Try 3 sample addresses</button></div></div>
      <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
    </form>
    <section class="panel windows-panel" aria-labelledby="windows-heading">
      <div class="section-heading"><h2 id="windows-heading">Your shared windows</h2><div id="date-tabs" class="date-tabs" role="group" aria-label="Schedule date"></div></div>
      <div id="windows" aria-live="polite"></div>
      <p class="result-meta" id="result-meta" hidden></p>
    </section>
    <section class="panel schedules-panel" aria-labelledby="schedules-heading">
      <div class="section-heading"><div><h2 id="schedules-heading">Schedules</h2><p id="schedule-date" class="section-subtitle"></p></div></div>
      <div class="timeline-scroll"><div id="timeline" class="timeline" aria-label="Half-hour electricity schedule"></div></div>
      <div id="tables" class="schedule-tables"></div>
      <div class="schedule-footer"><div class="legend"><span><i class="on"></i> Power on</span><span><i class="off"></i> Power off</span><span><i class="unknown"></i> Unknown</span></div><a href="https://www.dtek-kem.com.ua/ua/shutdowns" target="_blank" rel="noopener noreferrer">DTEK source ↗</a></div>
    </section>
    <footer class="page-footer"><p>Schedules may change during emergency outages.</p></footer>
  </main>
</body>
</html>
